# The last step of every job: if the job failed, stop the whole run. The
# forge's api cannot cancel a run; the forge box can (modules/forge/ci-cancel.py),
# once the forge has this job down as failed. No secret: nothing to leak.
name: stop the run on failure
runs:
  using: composite
  steps:
    # no condition here: inside a composite, failure() sees only the
    # action's own steps. The job's `if: failure()` on the use decides.
    - shell: bash
      run: |
        echo "this job failed; stopping run ${{ github.run_id }}"
        curl -fsS -X POST \
          "${{ github.server_url }}/_dd/ci/cancel/${{ github.run_id }}" || echo "the forge did not stop the run"
