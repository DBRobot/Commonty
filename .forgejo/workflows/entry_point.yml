# The whole ci, for the forge on node1, in one file so that one job can
# wait on every other: ci_ok, at the end, is the only check main's rule
# asks for (modules/forge/forgejo.nix), so the rule never names a job that
# no longer exists, and no job can fail without blocking the merge.
#
# Jobs run on the boxes, with nix already present, and build into each
# box's own store. files_modified says what changed; a job whose part did
# not change skips itself, and a skip still reports. The first failure
# anywhere stops the whole run (stop-run), so a dead run is red at once.
name: entry_point

# once per change: a pull request runs it. main moves only by merging a
# branch rebased onto it (the rule refuses an outdated one), so what lands
# is the tree this ran on, and a push to main runs nothing.
# A draft ("WIP: " in its title) runs the style and lint checks alone, and
# cannot pass ci_ok; taking WIP out is an edit, which starts the full run.
# An edit to a commit that already passed reruns the style check alone.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# one run per pull request: a new push cancels the run of the push before it
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  files_modified:
    runs-on: nix
    outputs:
      nix: ${{ steps.detect.outputs.nix }}
      rust: ${{ steps.detect.outputs.rust }}
      vm: ${{ steps.detect.outputs.vm }}
      app: ${{ steps.detect.outputs.app }}
      # the VM tests, the browser and Worker checks and the box installer
      # the change can reach, by what each one's evaluation reads
      # (nix/tests/ci-select)
      vm_tests: ${{ steps.detect.outputs.vm_tests }}
      worker_tests: ${{ steps.detect.outputs.worker_tests }}
      page_tests: ${{ steps.detect.outputs.page_tests }}
      site_checks: ${{ steps.detect.outputs.site_checks }}
      installer: ${{ steps.detect.outputs.installer }}
      draft: ${{ steps.detect.outputs.draft }}
      proven: ${{ steps.detect.outputs.proven }}
      # every box's system is built (hosts), on every box that runs CI
      # (builders): from fleet/boxes.json and what the release builds each
      # box with (fleetBuilt), so a box that joins is built and builds
      # without this file changing
      hosts: ${{ steps.boxes.outputs.hosts }}
      builders: ${{ steps.boxes.outputs.builders }}
      hosts_list: ${{ steps.boxes.outputs.hosts_list }}
      builders_list: ${{ steps.boxes.outputs.builders_list }}
      # the box flake_check runs on: one with room for it (the runner's
      # needs, nix/lib/ci-runners.nix); any runner when none has
      flake_check_on: ${{ steps.boxes.outputs.flake_check_on }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
        with:
          fetch-depth: 0 # the diff against the base needs history

      - name: the boxes
        id: boxes
        run: |
          node - <<'EOF'
          const b = require("./fleet/boxes.json");
          // and the devices' systems (the home controller): built like a box's
          const d = require("./fleet/devices.json");
          const hosts = [...Object.keys(b), ...Object.keys(d).filter((k) => k !== "_")].sort();
          // the boxes built with the CI runner, by the release (fleetBuilt)
          const built = JSON.parse(require("child_process").execFileSync("nix", ["eval", "--json", ".#legacyPackages.x86_64-linux.fleetBuilt"]).toString());
          const builders = hosts.filter((h) => (built[h] || []).includes("forgejo-runner"));
          require("fs").appendFileSync(process.env.GITHUB_OUTPUT, [
            `hosts=${JSON.stringify(hosts)}`,
            `builders=${JSON.stringify(builders)}`,
            `hosts_list=${hosts.join(" ")}`,
            `builders_list=${builders.join(" ")}`,
          ].join("\n") + "\n");
          console.log("hosts:", hosts.join(" "), " builders:", builders.join(" "));
          EOF
          fits=$(nix eval --json .#legacyPackages.x86_64-linux.ciRunners --apply 'r: r.flake-check')
          on=$(node -e 'const f = JSON.parse(process.argv[1]); console.log(f.length ? f[0] : "nix")' "$fits")
          echo "flake_check_on=$on" >> "$GITHUB_OUTPUT"
          echo "flake check on: $on (fits: $fits)"

      # Allowlists, not denylists: a path nothing claims runs everything.
      # Docs alone run style and lint. The VM tests, the worker_tests,
      # page_tests and site_checks checks and the box installer's drive are
      # chosen one by one, by what each one's evaluation reads (covers.json,
      # traced) and what its .nix files name (read here); the other jobs by
      # the path lists in ciselect.py. A wrong list is caught by
      # the boxes, which build the whole system from main at every release
      # and roll back what does not come up.
      - name: what changed?
        id: detect
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          ACTION: ${{ github.event.action }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/status?limit=100
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "draft=${DRAFT:-false}" >> "$GITHUB_OUTPUT"
          # a draft builds nothing; and an edit (the title, the body) to a
          # commit whose ci_ok already passed has nothing new to build
          proven=false
          if [ "$ACTION" = edited ]; then
            proven=$(printf 'Authorization: token %s\n' "$TOKEN" | curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --retry-max-time 300 -H @- "$STATUS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const st=JSON.parse(s).statuses||[];console.log(st.some(x=>x.context==="entry_point / ci_ok (pull_request)"&&x.status==="success")?"true":"false")})') || proven=false
          fi
          echo "proven=$proven" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = true ] || [ "$proven" = true ]; then
            echo "draft: $DRAFT  already passed: $proven  - nothing to build"
            nix shell .#ci-tools -c python3 nix/tests/ci-select/ciselect.py select --nothing
            exit 0
          fi
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            nix shell .#ci-tools -c python3 nix/tests/ci-select/ciselect.py select --everything
            exit 0
          fi
          git diff --name-status "$BASE" HEAD | sed 's/^/  /'
          nix shell .#ci-tools -c python3 nix/tests/ci-select/ciselect.py select "$BASE" HEAD

  # ---- nix: is the flake well-formed, and does every box still build

  flake_check:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.nix == 'true' }}
    runs-on: ${{ needs.files_modified.outputs.flake_check_on }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      # evaluate everything, build nothing: the vm tests are built by their
      # own jobs, only when what a box runs changed
      # the check does not write a derivation it has not seen, then asks
      # the store for it ("path ...drv is not valid"); the packages' source
      # trees are derivations, so they are written first: every package,
      # from the flake, so a new one cannot be left off, and the workspace
      # checks' own tree
      - name: instantiate the packages
        run: |
          nix path-info --derivation $(nix eval --raw .#packages.x86_64-linux --apply 'ps: builtins.concatStringsSep " " (map (n: ".#" + n) (builtins.attrNames ps))') .#checks.x86_64-linux.fmt >/dev/null
      # Every check, package, dev shell and box system evaluated, each in a
      # worker of its own that starts afresh past 1.5G (nix-eval-jobs,
      # legacyPackages ciEval): one evaluator for all of it grew to 10.5G
      # and took node2 out of memory. A worker for every 16G the box has,
      # one to four: about 3G at one worker, 5G at two.
      - name: evaluate everything
        run: |
          kb=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          workers=$(( kb / 16777216 )); [ "$workers" -ge 1 ] || workers=1; [ "$workers" -le 4 ] || workers=4
          nix shell .#ci-tools -c nix-eval-jobs --flake .#legacyPackages.x86_64-linux.ciEval --force-recurse \
            --workers "$workers" --max-memory-size 1536 > "$RUNNER_TEMP/eval.jsonl"
          nix shell .#ci-tools -c python3 - "$RUNNER_TEMP/eval.jsonl" <<'PY'
          import json, sys
          jobs = [json.loads(l) for l in open(sys.argv[1])]
          bad = [j for j in jobs if "error" in j]
          for j in bad:
              print(f"::error::{j['attr']}: {j['error']}")
          print(f"{len(jobs)} evaluated, {len(bad)} failed")
          sys.exit(1 if bad or not jobs else 0)
          PY
      # the checks that are plain evaluation, no vm: seconds
      # evaluating builds nothing, so a check whose whole answer is whether
      # it builds says nothing there.
      # ci is one of those: it holds this file to the flake's vm tests and
      # to ci_ok waiting on every job.
      # a date can only be read at run time: a nix check is cached and
      # never looks at the clock again
      - name: security.txt has not lapsed
        run: |
          expires=$(nix eval --raw .#nixosConfigurations.node1.config.dd.securityTxtExpires)
          left=$(( ( $(date -u -d "$expires" +%s) - $(date -u +%s) ) / 86400 ))
          echo "security.txt expires $expires, $left days from now"
          [ "$left" -ge 60 ] || { echo "move dd.securityTxtExpires on (nix/modules/gate/security-txt.nix), at most a year out"; exit 1; }
          [ "$left" -le 366 ] || { echo "RFC 9116 wants Expires under a year away"; exit 1; }
      - name: plaintext labels, box list, and this file
        run: nix build --no-link .#checks.x86_64-linux.plaintext-label .#checks.x86_64-linux.boxes .#checks.x86_64-linux.box-reports .#checks.x86_64-linux.ci .#checks.x86_64-linux.ci-select .#checks.x86_64-linux.stylesheet .#checks.x86_64-linux.cargo-nix .#checks.x86_64-linux.nginx .#checks.x86_64-linux.usage-facts .#checks.x86_64-linux.fleet-defaults .#checks.x86_64-linux.retention .#checks.x86_64-linux.terms-version .#checks.x86_64-linux.needs-units .#checks.x86_64-linux.placement .#checks.x86_64-linux.safe-rd .#checks.x86_64-linux.runner-capacity .#checks.x86_64-linux.cache-trust .#checks.x86_64-linux.placement-fleet .#checks.x86_64-linux.pdf-editor .#checks.x86_64-linux.calendar-js .#checks.x86_64-linux.git-path
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The keep steps (keep-inputs.sh) root what a box's GC made CI build
  # again: the cross rustc, crane's dependency builds, the crates. This
  # holds every job's keep step to naming those builds (nix/tests/ci-keep.nix).
  # It reads the .drv files under each, so a job of its own beside
  # flake_check (4-9 min, 1.5-1.8G on node1), on a box with that room.
  inputs_kept:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.nix == 'true' }}
    runs-on: ${{ needs.files_modified.outputs.flake_check_on }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: the keep steps cover the slow builds
        run: nix eval --impure --raw --file nix/tests/ci-keep.nix
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The Cloudflare Workers end to end, each the very files a release
  # uploads, run by wrangler against fakes, no vm: mail (mail-worker), DNS
  # (dns-worker), sign-in once for every box (sso: the id Worker and the
  # gate), the control plane's relay, witness and validators (control).
  # Seconds each, and a cache hit when nothing they read changed.
  worker_tests:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.nix == 'true' && needs.files_modified.outputs.worker_tests != '[]' }}
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        # those the change can reach (files_modified, ciselect.py GROUPS)
        check: ${{ fromJSON(needs.files_modified.outputs.worker_tests) }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: ${{ matrix.check }}
        run: nix build --no-link -L .#checks.x86_64-linux.${{ matrix.check }} --print-out-paths >> "$RUNNER_TEMP/built"
      # what it was built from, kept through the box's GC (keep-inputs.sh)
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh worker_tests-${{ matrix.check }} "$RUNNER_TEMP/built"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The pages as the app serves them, in a browser against a made-up app
  # and box: Mail (mail-page), Files (files-page), and every bar link and
  # home tile staying in its tab (same-tab).
  page_tests:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.nix == 'true' && needs.files_modified.outputs.page_tests != '[]' }}
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        # those the change can reach (files_modified, ciselect.py GROUPS)
        check: ${{ fromJSON(needs.files_modified.outputs.page_tests) }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: ${{ matrix.check }}
        run: nix build --no-link -L .#checks.x86_64-linux.${{ matrix.check }} --print-out-paths >> "$RUNNER_TEMP/built"
      # what it was built from, kept through the box's GC (keep-inputs.sh)
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh page_tests-${{ matrix.check }} "$RUNNER_TEMP/built"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The site as a browser meets it, through node1's nginx and the real
  # gate with stand-ins behind it (nix/tests/site.nix): headers, roles,
  # accessibility, speed, links (docs/dev/ci.md, The site checks).
  site_checks:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.nix == 'true' && needs.files_modified.outputs.site_checks != '[]' }}
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        # those the change can reach (files_modified, ciselect.py GROUPS)
        check: ${{ fromJSON(needs.files_modified.outputs.site_checks) }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: ${{ matrix.check }}
        run: nix build --no-link -L .#checks.x86_64-linux.${{ matrix.check }} --print-out-paths >> "$RUNNER_TEMP/built"
      # what it was built from, kept through the box's GC (keep-inputs.sh)
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh site_checks-${{ matrix.check }} "$RUNNER_TEMP/built"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The programs every box and every vm test carry, built once and uploaded
  # to the bucket; the jobs after it download them instead of each compiling
  # the same rust again. In two halves the forge hands to whichever runners
  # are free, so both boxes compile at once; each builds its own, no box
  # takes another's build on trust. Beside flake_check, not after it: a
  # failure there stops this anyway, and waiting cost every run minutes.
  build_programs:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.nix == 'true' }}
    runs-on: nix
    strategy:
      fail-fast: true
      matrix:
        part: [cli, boxes]
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: build ${{ matrix.part }}
        run: |
          case "${{ matrix.part }}" in
            cli) nix build --no-link .#dd .#web --print-out-paths >> "$RUNNER_TEMP/built" ;;
            boxes) nix build --no-link .#verify .#agent .#games .#computers .#transcode --print-out-paths >> "$RUNNER_TEMP/built" ;;
          esac
      # what these were built from, kept through the box's GC (keep-inputs.sh)
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh part-${{ matrix.part }} "$RUNNER_TEMP/built"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # Every box's system, built on every box. A box vouches for a release
  # (dd-attest) only for what it built itself or rebuilt to compare, and it
  # vouches for all the boxes' systems, not its own alone: built here in
  # CI, the release finds it all already built by this box's own daemon
  # and the check takes seconds instead of rebuilding after the merge.
  # Each records what it built under its own name; systems_agree holds the
  # two builders of a system to one store path.
  build_systems:
    needs: [files_modified, build_programs]
    if: ${{ needs.files_modified.outputs.nix == 'true' }}
    runs-on: ${{ matrix.on }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.files_modified.outputs.hosts) }}
        on: ${{ fromJSON(needs.files_modified.outputs.builders) }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      # kept from garbage collection, the newest of each system, until the
      # next run replaces it: a box's weekly collection otherwise takes the
      # other box's system with it, and the next run builds it all again
      # (node2 compiled node1's Wine, which no public cache has, for half
      # an hour)
      - name: build ${{ matrix.host }} on ${{ matrix.on }}
        run: |
          mkdir -p "$HOME/ci-roots"
          nix build --print-out-paths --out-link "$HOME/ci-roots/${{ matrix.host }}" \
            .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel | tee "$RUNNER_TEMP/toplevel"
      # what it was built from, kept through the box's GC (keep-inputs.sh):
      # the home controller's holds the aarch64 cross rustc
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh host-${{ matrix.host }} "$RUNNER_TEMP/toplevel"
      # the token on stdin, not curl's command line, which any process on
      # the box can read while it runs
      - name: record the path
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Authorization: token %s\n' "$TOKEN" | curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --retry-max-time 300 -X POST -H @- -H 'content-type: application/json' \
            -d "{\"state\":\"success\",\"context\":\"build/${{ matrix.host }}@${{ matrix.on }}\",\"description\":\"$(cat "$RUNNER_TEMP/toplevel")\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The two builds of each system are one store path. A system's path is
  # fixed by its derivation, not by the bytes the build makes, so this
  # catches the builders evaluating the commit differently, not a build
  # that is not reproducible: two different outputs land at the same path.
  # The bytes are dd-attest's at publish (two boxes must report the same
  # closure digest, and it rebuilds with --check what it did not build).
  # Then build/<host>, which `dd release publish` signs rather than
  # building again.
  systems_agree:
    needs: [files_modified, build_systems]
    if: ${{ needs.files_modified.outputs.nix == 'true' }}
    runs-on: nix
    steps:
      - name: both builders agree
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          HOSTS: ${{ needs.files_modified.outputs.hosts_list }}
          BUILDERS: ${{ needs.files_modified.outputs.builders_list }}
        run: |
          node --input-type=module - <<'EOF'
          const { TOKEN, API, SHA, RUN, HOSTS, BUILDERS } = process.env;
          const headers = { authorization: `token ${TOKEN}`, 'content-type': 'application/json' };
          // oldest first by index (the forge calls that order highestindex):
          // the default, newest first by time, puts two statuses made in the
          // same second in no fixed order, and one fell between two pages on
          // every read. A status added while this pages lands on the end.
          // Read until no build/ status is missing, or five reads
          const want = HOSTS.split(' ').flatMap((h) => BUILDERS.split(' ').map((b) => `build/${h}@${b}`));
          let all = [];
          for (let read = 1; read <= 5; read++) {
            all = [];
            for (let page = 1; ; page++) {
              const r = await fetch(`${API}/commits/${SHA}/statuses?sort=highestindex&limit=50&page=${page}`, { headers });
              if (!r.ok) throw new Error(`statuses: http ${r.status}`);
              const got = await r.json();
              all.push(...got);
              if (got.length < 50) break;
            }
            if (want.every((c) => all.some((s) => s.context === c && s.status === 'success'))) break;
            await new Promise((d) => setTimeout(d, 3000));
          }
          // oldest first: the last success per context is the one that counts
          const path = (ctx) => all.findLast((s) => s.context === ctx && s.status === 'success')?.description;
          let bad = false;
          for (const host of HOSTS.split(' ')) {
            const by = BUILDERS.split(' ').map((b) => [b, path(`build/${host}@${b}`)]);
            for (const [b, p] of by) console.log(`${host} on ${b}: ${p ?? 'nothing recorded'}`);
            const paths = new Set(by.map(([, p]) => p));
            if (paths.size !== 1 || paths.has(undefined)) {
              console.log(`${host}: the builders disagree on the path: they evaluated the commit differently (or one did not record)`);
              bad = true;
              continue;
            }
            const r = await fetch(`${API}/statuses/${SHA}`, {
              method: 'POST', headers,
              body: JSON.stringify({ state: 'success', context: `build/${host}`, description: by[0][1], target_url: RUN }),
            });
            if (!r.ok) throw new Error(`recording build/${host}: http ${r.status}`);
          }
          process.exit(bad ? 1 : 0);
          EOF
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # one job per test, so they spread over every runner box and run at once
  vm_tests:
    needs: [files_modified, build_programs]
    if: ${{ needs.files_modified.outputs.nix == 'true' && needs.files_modified.outputs.vm == 'true' }}
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        # those the change can reach (files_modified); a test not chosen
        # is not run, and the job still reports
        test: ${{ fromJSON(needs.files_modified.outputs.vm_tests) }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: ${{ matrix.test }}
        run: nix build --no-link .#checks.x86_64-linux.${{ matrix.test }}
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # ---- the pull request itself: its title and body, its commits, and the
  # files it changes (.forgejo/checks/style.py). Every finding blocks.

  style:
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
        with:
          fetch-depth: 0 # the commits since the base
      # the title and body by the environment, never pasted into the script:
      # a title is anyone's text
      - name: title, body, commits and files
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHORS: davidsprojects7@gmail.com
        run: nix shell .#ci-tools -c python3 .forgejo/checks/style.py
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The linters, on what changed (.forgejo/checks/lint.py): a real fault
  # blocks, the rest is a yellow lint/warnings status that blocks nothing.
  lint:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.proven != 'true' }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
        with:
          fetch-depth: 0
      - name: faults and warnings
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: nix shell .#ci-tools -c python3 .forgejo/checks/lint.py
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # ---- rust: everything in servers/ and client/ formatted, lint-clean, and
  # the tests pass - the end-to-end ones included, which run boxes
  # in-process and try to break them. Each is a nix derivation on the same
  # compiled artifacts as the binaries (flake.nix: checks fmt, clippy,
  # tests), cached by content: a run whose rust did not change gets last
  # time's answer in seconds. One job: clippy's test build of a crate is
  # the one the tests run (flake.nix crateTest), so it compiles once.
  rust:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.rust == 'true' }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: fmt, clippy and cargo test (unit tests + e2e gates on localhost; app excluded)
        run: nix build --no-link -L .#checks.x86_64-linux.fmt .#checks.x86_64-linux.clippy .#checks.x86_64-linux.tests --print-out-paths >> "$RUNNER_TEMP/built"
      # what these were built from, kept through the box's GC (keep-inputs.sh)
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh rust "$RUNNER_TEMP/built"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The app on its own: its dependency tree (tauri, webkit) is most of
  # any compile, so the workspace checks leave it out and this runs only
  # when the app or what it builds on changed. Its downloads are built
  # after a release, not here: two boxes build them when one changes the
  # app (dd release app-next, docs/dev/app-release.md).
  app_checks:
    needs: files_modified
    if: ${{ needs.files_modified.outputs.app == 'true' }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      # its lint, its tests, and its network engine's vet and tests: one
      # job, on the app's own cached dependency build
      - name: the app's lint and tests, and its engine's
        run: nix build --no-link -L .#checks.x86_64-linux.clippy-app .#checks.x86_64-linux.tests-app .#checks.x86_64-linux.net-check .#legacyPackages.x86_64-linux.appReleaseEvaluates --print-out-paths >> "$RUNNER_TEMP/built"
      # what these were built from, kept through the box's GC (keep-inputs.sh)
      - name: keep what it was built from
        run: .forgejo/checks/keep-inputs.sh app_checks "$RUNNER_TEMP/built"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The box installer's drive (nix/installer/image.nix) is an app download,
  # and two boxes must build it to the same bytes or no app ships
  # (docs/dev/app-release.md). Built on every runner box and again there
  # with --rebuild, each recording its NAR hash; installer_agrees holds the
  # boxes to one hash. One machine agreeing with itself is not enough, so
  # both halves count. Only when something the drive's evaluation reads
  # changed (covers.json "installer": nix/installer, the agent's crates,
  # the shared pages, the fleet files it embeds; flake.lock runs all).
  # always started, its steps skipped when the installer is not chosen: a
  # whole matrix job skipped with runs-on from its matrix left ci_ok blocked
  # forever on the forge (run 857, 2026-10-24)
  build_installer:
    needs: files_modified
    runs-on: ${{ matrix.on }}
    strategy:
      fail-fast: false
      matrix:
        on: ${{ fromJSON(needs.files_modified.outputs.builders) }}
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
        if: ${{ needs.files_modified.outputs.installer == 'true' }}
      - name: build the installer's drive on ${{ matrix.on }}, then again to compare
        if: ${{ needs.files_modified.outputs.installer == 'true' }}
        run: |
          # an out-link is a root: the box's GC deleted the unrooted first
          # build before the rebuild could compare against it (2026-10-23)
          out=$(nix build --out-link "$RUNNER_TEMP/installer" --print-out-paths .#installers.x86_64-linux.box)
          nix build --no-link --rebuild .#installers.x86_64-linux.box
          nix path-info --json-format 1 --json "$out" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(Object.values(JSON.parse(s))[0].narHash))' | tee "$RUNNER_TEMP/nar"
      - name: record the hash
        if: ${{ needs.files_modified.outputs.installer == 'true' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'Authorization: token %s\n' "$TOKEN" | curl -fsS --retry 12 --retry-delay 10 --retry-all-errors --retry-max-time 300 -X POST -H @- -H 'content-type: application/json' \
            -d "{\"state\":\"success\",\"context\":\"installer@${{ matrix.on }}\",\"description\":\"$(cat "$RUNNER_TEMP/nar")\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  installer_agrees:
    needs: [files_modified, build_installer]
    if: ${{ needs.files_modified.outputs.installer == 'true' }}
    runs-on: nix
    steps:
      - name: every builder made the same bytes
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILDERS: ${{ needs.files_modified.outputs.builders_list }}
        run: |
          node --input-type=module - <<'EOF'
          const { TOKEN, API, SHA, BUILDERS } = process.env;
          const headers = { authorization: `token ${TOKEN}` };
          const all = [];
          for (let page = 1; ; page++) {
            const r = await fetch(`${API}/commits/${SHA}/statuses?sort=highestindex&limit=50&page=${page}`, { headers });
            if (!r.ok) throw new Error(`statuses: http ${r.status}`);
            const got = await r.json();
            all.push(...got);
            if (got.length < 50) break;
          }
          // oldest first by index (see systems_agree): the last success per
          // context is the one that counts
          const by = BUILDERS.split(' ').map((b) => [b, all.findLast((s) => s.context === `installer@${b}` && s.status === 'success')?.description]);
          for (const [b, h] of by) console.log(`${b}: ${h ?? 'nothing recorded'}`);
          const hashes = new Set(by.map(([, h]) => h));
          if (hashes.size !== 1 || hashes.has(undefined)) {
            console.log('the builders made different bytes (or one did not record): diff the two images (docs/dev/joining.md)');
            process.exit(1);
          }
          EOF
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # ---- the one check main's rule asks for

  # Every job above, passed or rightly skipped, and not a draft. It runs whatever they did
  # (always()), so a failure reports here at once; a run stop-run cancels
  # never reaches it and is refused the same way. nix/tests/ci.nix fails
  # the build if a job is missing from this list.
  ci_ok:
    needs: [files_modified, style, lint, flake_check, inputs_kept, worker_tests, page_tests, site_checks, build_programs, build_systems, systems_agree, vm_tests, rust, app_checks, build_installer, installer_agrees]
    if: ${{ always() }}
    runs-on: nix
    steps:
      - name: every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ needs.files_modified.outputs.draft }}
        run: |
          node --input-type=module - <<'EOF'
          const needs = JSON.parse(process.env.NEEDS);
          let bad = false;
          if (process.env.DRAFT === 'true') {
            console.log('a draft: take "WIP: " out of the title to run everything and merge');
            bad = true;
          }
          for (const [job, { result }] of Object.entries(needs)) {
            const ok = result === 'success' || (result === 'skipped' && job !== 'files_modified');
            console.log(`${ok ? 'ok  ' : 'FAIL'} ${job}: ${result}`);
            if (!ok) bad = true;
          }
          process.exit(bad ? 1 : 0);
          EOF
