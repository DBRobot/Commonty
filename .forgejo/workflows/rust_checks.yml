# Everything in box/ and client/: formatted, lint-clean, and the tests pass - the
# end-to-end ones included, which run boxes in-process and try to break them.
# Called from entry_point.yml; not triggered on its own. Each is a nix
# derivation on the same compiled artifacts as the binaries (flake.nix:
# checks fmt, clippy, tests): built once, cached by content in the bucket,
# and a run whose rust did not change gets last time's answer in seconds.
name: rust_checks

on:
  workflow_call:
    inputs:
      run:
        description: "false: report every job as skipped"
        type: boolean
        default: true
      app:
        description: "the app or something it builds on changed"
        type: boolean
        default: false

jobs:
  lint:
    if: ${{ inputs.run }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: fmt and clippy
        run: nix build --no-link .#checks.x86_64-linux.fmt .#checks.x86_64-linux.clippy
      - uses: ./.forgejo/actions/stop-run
        if: failure()
        with:
          secret: ${{ secrets.DD_CI }}

  # The app on its own: its dependency tree (tauri, webkit) is most of
  # any compile, so the workspace checks above leave it out and this runs
  # only when the app or what it builds on changed.
  app_lint:
    if: ${{ inputs.app }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: clippy on the app
        run: nix build --no-link .#checks.x86_64-linux.clippy-app
      - uses: ./.forgejo/actions/stop-run
        if: failure()
        with:
          secret: ${{ secrets.DD_CI }}

  test:
    if: ${{ inputs.run }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@v4
      - name: cargo test (unit tests + e2e gates on localhost; app excluded)
        run: nix build --no-link -L .#checks.x86_64-linux.tests
      - uses: ./.forgejo/actions/stop-run
        if: failure()
        with:
          secret: ${{ secrets.DD_CI }}
