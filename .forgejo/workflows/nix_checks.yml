# Everything nix: is the flake well-formed, and does every box still build.
# Called from entry_point.yml; not triggered on its own. Builds land in the
# runner box's own store and in the nix-cache bucket, so a green build_host
# is a deployable closure any box can fetch.
name: nix_checks

on:
  workflow_call:
    inputs:
      run:
        description: "false: report every job as skipped"
        type: boolean
        default: true
      vm:
        description: "boot the boxes as vms and drive the failure cases"
        type: boolean
        default: false

jobs:
  flake_check:
    if: ${{ inputs.run }}
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      # evaluate everything, build nothing: the vm tests are built by their
      # own jobs, only when what a box runs changed
      # the check does not write a derivation it has not seen, then asks
      # the store for it ("path ...drv is not valid"); the packages' source
      # trees are derivations, so they are written first: every package,
      # from the flake, so a new one cannot be left off, and the workspace
      # checks' own tree
      - name: instantiate the packages
        run: |
          nix path-info --derivation $(nix eval --raw .#packages.x86_64-linux --apply 'ps: builtins.concatStringsSep " " (map (n: ".#" + n) (builtins.attrNames ps))') .#checks.x86_64-linux.fmt >/dev/null
      - name: flake check
        run: nix flake check --no-build --show-trace
      # the checks that are plain evaluation, no vm: seconds
      # `nix flake check --no-build` evaluates and builds nothing, so a
      # check whose whole answer is whether it builds says nothing there.
      # ci-matrix-matches is one of those: a vm test added to the flake
      # and forgotten in the matrix above went unnoticed until the forge
      # refused a merge for a required check that had never run.
      - name: placement, box list, and the ci matrix
        run: nix build --no-link .#checks.x86_64-linux.placement .#checks.x86_64-linux.boxes .#checks.x86_64-linux.ci .#checks.x86_64-linux.stylesheet .#checks.x86_64-linux.cargo-nix .#checks.x86_64-linux.nginx
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The mail Worker end to end: the files a release uploads, run by wrangler
  # against a fake Cloudflare and driven by a browser (nix/tests/mail-worker).
  # Beside the builds, not after them: seconds, and a cache hit when the
  # Worker has not changed.
  mail_worker:
    if: ${{ inputs.run }}
    needs: flake_check
    runs-on: nix
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: the mail Worker, in a browser
        run: nix build --no-link -L .#checks.x86_64-linux.mail-worker
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # The programs every box and every vm test carry. Built once, after the
  # cheap checks pass, and uploaded to the bucket; the jobs below then
  # download them instead of each compiling the same rust workspace again
  # on whichever box it lands.
  # The programs, in two halves the forge hands to whichever runners are
  # free, so both boxes compile crates at once. Each half builds its own:
  # no box takes another's build on trust.
  build_part:
    if: ${{ inputs.run }}
    needs: flake_check
    runs-on: nix
    strategy:
      fail-fast: true
      matrix:
        part: [cli, boxes]
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: build ${{ matrix.part }}
        run: |
          case "${{ matrix.part }}" in
            cli) nix build --no-link .#dd .#web ;;
            boxes) nix build --no-link .#verify .#agent .#games .#transcode ;;
          esac
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # the name main's rule asks for, and what the later jobs wait on
  build_client:
    if: ${{ inputs.run }}
    needs: build_part
    runs-on: nix
    steps:
      - run: "true"

  # Every box's system, built on every box. A box vouches for a release
  # (dd-attest) only for what it built itself or rebuilt to compare, and it
  # vouches for all the boxes' systems, not its own alone: built here in
  # CI, the release finds it all already built by this box's own daemon
  # and the check takes seconds instead of rebuilding after the merge.
  build_host:
    if: ${{ inputs.run }}
    needs: build_client
    runs-on: ${{ matrix.on }}
    strategy:
      fail-fast: false
      matrix:
        host: [node1, node2]
        on: [node1, node2]
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: build ${{ matrix.host }} on ${{ matrix.on }}
        run: nix build --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel | tee "$RUNNER_TEMP/toplevel"
      # what was built, as a status on the commit: `dd release publish`
      # reads it and signs that path instead of building again
      - name: record the path
        run: |
          curl -fsS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H 'content-type: application/json' \
            -d "{\"state\":\"success\",\"context\":\"build/${{ matrix.host }}\",\"description\":\"$(cat "$RUNNER_TEMP/toplevel")\",\"target_url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: ./.forgejo/actions/stop-run
        if: failure()

  # one job per test, so they spread over every runner box and run at once
  vm_tests:
    if: ${{ inputs.run && inputs.vm }}
    needs: build_client
    runs-on: nix
    strategy:
      fail-fast: false
      matrix:
        test: [console, directory, metrics, backup, release, thanos, members-runner, games, forge, transcode, network, library, pgrestore, llm, vault, adblock]
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a tag can be moved
      - name: ${{ matrix.test }}
        run: nix build --no-link .#checks.x86_64-linux.${{ matrix.test }}
      - uses: ./.forgejo/actions/stop-run
        if: failure()
