[package]
name = "verify"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "verify"
path = "src/main.rs"

[dependencies]
askama = "0.16"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# pulling peers' directories
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
identity = { path = "../../client/identity" }
ente = { path = "../../client/ente" }
# the release key's signed documents: the app manifest the download page
# offers from
release = { path = "../release" }
# the libraries bucket and WebDAV over it; this crate decides who may
library-gate = { path = "../library" }
base64 = "0.22"
ed25519-dalek = "2"
# the token format devices sign; the verifier only ever holds public keys
biscuit-auth = "6"
# the box's own browser login: passkeys verified HERE, against keys enrolled
# here, issuing a cookie only this box's services accept. kanidm's mint is not
# in the path.
webauthn-rs = "0.6.1-dev"
hmac = "0.12"
sha2 = "0.10"
# signs the per-box id token Passwords' sign-in asks for (oidc.rs)
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
p256 = "0.13"
url = "2"
# the forge's changes as they happen: Postgres LISTEN on a channel a trigger
# in Forgejo's database announces on (forge_events.rs), no polling
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
