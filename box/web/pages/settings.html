<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="/_dd/static/home.css">
  <link rel="stylesheet" href="/_dd/static/storage.css">
</head>
<body>
  <header class="dd-bar">
    <div class="bar">
      <a class="brand" href="/_dd/home" aria-label="Commonty">
        <svg viewBox="0 0 22 22" aria-hidden="true">
          <rect class="mark-line" x="1" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="12" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="1" y="12" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-fill" x="12" y="12" width="9" height="9"/>
        </svg>
        <span>Commonty</span>
      </a>
      <div class="me" id="me"></div>
    </div>
  </header>
  <main class="st">
    <h1>Settings</h1>

    <section class="st-box" aria-labelledby="mail">
      <header><h2 id="mail">Email</h2></header>
      <div class="st-rules">
        <p class="st-state" id="state">Checking…</p>
        <p><button class="quiet" id="again" type="button" hidden>Send the confirmation again</button></p>

        <div id="changer">
          <button id="change" type="button">Change email</button>
        </div>

        <form class="em-form" id="form" hidden>
          <label for="email">New email address</label>
          <div class="em-row">
            <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
            <button id="save" type="submit">Save</button>
          </div>
        </form>
        <p class="st-muted" id="msg" role="status"></p>
      </div>
    </section>
  </main>
  <script type="module" src="/_dd/static/settings.js"></script>
  <script type="module" src="/_dd/static/shell.js"></script>
</body>
</html>
