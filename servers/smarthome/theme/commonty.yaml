# Home Assistant's look, from servers/web-shared/home.css's tokens. HA reads
# these as CSS variables; names it does not know are ignored, so a renamed
# one shows as HA's default rather than breaking the page.
commonty:
  ha-font-family-body: '"Public Sans", "Segoe UI", Helvetica, Arial, sans-serif'
  primary-font-family: '"Public Sans", "Segoe UI", Helvetica, Arial, sans-serif'
  paper-font-common-base_-_font-family: '"Public Sans", "Segoe UI", Helvetica, Arial, sans-serif'
  code-font-family: '"IBM Plex Mono", ui-monospace, Consolas, monospace'
  ha-card-border-radius: "4px"
  ha-card-box-shadow: "none"
  ha-card-border-width: "1px"
  ha-dialog-border-radius: "4px"
  mdc-shape-small: "4px"
  mdc-shape-medium: "4px"
  modes:
    light:
      primary-color: "#1D4470"
      accent-color: "#1D5C42"
      text-primary-color: "#FFFFFF"
      primary-background-color: "#EEF1F5"
      secondary-background-color: "#EEF1F5"
      card-background-color: "#FFFFFF"
      ha-card-background: "#FFFFFF"
      ha-card-border-color: "#D5D9D3"
      primary-text-color: "#1A1F1C"
      secondary-text-color: "#525A55"
      disabled-text-color: "#8A918C"
      divider-color: "#D5D9D3"
      app-header-background-color: "#FFFFFF"
      app-header-text-color: "#1A1F1C"
      app-header-border-bottom: "1px solid #D5D9D3"
      sidebar-background-color: "#FFFFFF"
      sidebar-text-color: "#525A55"
      sidebar-icon-color: "#525A55"
      sidebar-selected-text-color: "#1D4470"
      sidebar-selected-icon-color: "#1D4470"
      state-icon-color: "#525A55"
      state-active-color: "#8A5A12"
      state-light-on-color: "#8A5A12"
      state-switch-on-color: "#8A5A12"
      state-lock-locked-color: "#1D5C42"
      state-lock-unlocked-color: "#B3401F"
      success-color: "#1D5C42"
      warning-color: "#8A5A12"
      error-color: "#B3401F"
      info-color: "#1D4470"
    dark:
      primary-color: "#9CC3EA"
      accent-color: "#2F7D59"
      text-primary-color: "#0F1318"
      primary-background-color: "#0F1318"
      secondary-background-color: "#0F1318"
      card-background-color: "#171C22"
      ha-card-background: "#171C22"
      ha-card-border-color: "#2A313B"
      primary-text-color: "#E5E9EE"
      secondary-text-color: "#A1A9B3"
      disabled-text-color: "#5E6862"
      divider-color: "#2A313B"
      app-header-background-color: "#171C22"
      app-header-text-color: "#E5E9EE"
      app-header-border-bottom: "1px solid #2A313B"
      sidebar-background-color: "#171C22"
      sidebar-text-color: "#A1A9B3"
      sidebar-icon-color: "#A1A9B3"
      sidebar-selected-text-color: "#9CC3EA"
      sidebar-selected-icon-color: "#9CC3EA"
      state-icon-color: "#A1A9B3"
      state-active-color: "#E3B769"
      state-light-on-color: "#E3B769"
      state-switch-on-color: "#E3B769"
      state-lock-locked-color: "#7CCBA2"
      state-lock-unlocked-color: "#E88A6A"
      success-color: "#7CCBA2"
      warning-color: "#E3B769"
      error-color: "#E88A6A"
      info-color: "#9CC3EA"
