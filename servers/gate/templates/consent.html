{# every sign-up's questions (servers/web-shared/age.js): the birth date is only checked in the page, never sent #}
<fieldset class="consent">
  <legend>Month and year of birth</legend>
  <div class="born">
    <div><label for="born-month">Month</label><select id="born-month" autocomplete="off" aria-describedby="born-hint"><option value="">Choose</option></select></div>
    <div><label for="born-year">Year</label><select id="born-year" autocomplete="off" aria-describedby="born-hint"><option value="">Choose</option></select></div>
  </div>
  <p class="hint" id="born-hint">Only checked here, never kept. You must be at least 13.</p>
</fieldset>
<p class="refused" id="age-refused" role="alert" tabindex="-1" hidden>Commonty is only for people aged 13 or over, so this account cannot be made.</p>
<label class="check" id="guardian-row" hidden><input type="checkbox" id="guardian"> A parent or guardian agrees to me using Commonty</label>
<label class="check"><input type="checkbox" id="agree"> I agree to the <a href="https://{{ domain }}/docs/policies/terms" target="_blank" rel="noopener">Terms of use</a> and the <a href="https://{{ domain }}/docs/policies/privacy" target="_blank" rel="noopener">Privacy policy</a></label>
