[package]
name = "games"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Game servers a member starts for themselves: the manager behind the Games tile"

[[bin]]
name = "dd-games"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["form", "query"] }
askama = "0.16"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# asks the gate on this box who the owner's friends are (never over the network)
reqwest = { version = "0.12", default-features = false, features = ["json"] }
