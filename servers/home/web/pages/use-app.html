<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Commonty</title>
  <link rel="stylesheet" href="/_dd/static/home.css">
  <link rel="stylesheet" href="/_dd/static/bar.css">
  <script type="module" src="/_dd/static/use-app.js"></script>
</head>
<body>
  <a class="skip-to" href="#main">Skip to content</a>
  <header class="dd-bar">
    <div class="bar">
      <a class="brand" id="home-link" href="/" aria-label="Commonty">
        <svg viewBox="0 0 22 22" aria-hidden="true">
          <rect class="mark-line" x="1" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="12" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="1" y="12" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-fill" x="12" y="12" width="9" height="9"/>
        </svg>
        <span>Commonty</span>
      </a>
    </div>
  </header>
  <main id="main" class="auth">
    <section class="add-device" id="use-app" hidden>
      <h1 id="what">Commonty</h1>
      <p><button id="open" type="button">Open with the Commonty app</button></p>
      <p class="small"><a id="download" href="/_dd/download">Get the app</a></p>
    </section>
    <section class="add-device" id="opening" hidden>
      <h1>Opening in the Commonty app…</h1>
    </section>
    <section class="add-device" id="opened" hidden>
      <h1>Opened in the Commonty app</h1>
    </section>
    <section class="add-device" id="not-open" hidden>
      <h1>The Commonty app didn't answer</h1>
      <p><a class="button" id="download-2" href="/_dd/download">Get the app</a> <button class="quiet" id="retry" type="button">Try again</button></p>
    </section>
    <section class="add-device" id="signed-in" hidden>
      <h1>Signed in</h1>
      <p class="lead">Go back to Bitwarden. You can close this tab.</p>
    </section>
    <section class="add-device" id="sso" hidden>
      <h1>Signing in…</h1>
      <p class="lead" id="sso-why"></p>
    </section>
  </main>
  <script type="module" src="/_dd/static/footer.js"></script>
</body>
</html>
