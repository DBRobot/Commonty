<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs · Commonty</title>
  <link rel="icon" type="image/svg+xml" href="/_dd/static/favicon.svg">
  <link rel="stylesheet" href="/_dd/static/home.css">
  <link rel="stylesheet" href="/_dd/static/docs.css">
</head>
<body class="docspage">
  <header class="dd-bar" data-public>
    <div class="bar">
      <a class="brand" href="/docs" aria-label="Commonty">
        <svg viewBox="0 0 22 22" aria-hidden="true">
          <rect class="mark-line" x="1" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="12" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="1" y="12" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-fill" x="12" y="12" width="9" height="9"/>
        </svg>
        <span>Commonty</span>
      </a>
      <div class="me" id="me"></div>
    </div>
  </header>

  <div class="docs">
    <button type="button" class="contents-btn" id="contents-btn" aria-expanded="false" aria-controls="docs-nav">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Contents
    </button>
    <nav class="docs-nav" id="docs-nav" aria-label="Docs"></nav>
    <article class="docs-page">
      <div class="docs-head">
        <div class="docs-crumb" id="docs-crumb"></div>
        <span class="docs-seg" role="group" aria-label="View">
          <button type="button" id="view-page" aria-pressed="true">Page</button><button type="button" id="view-md" aria-pressed="false">Markdown</button>
        </span>
        <a class="docs-btn" id="docs-edit" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5"/></svg>Source
        </a>
      </div>
      <div id="docs-body" aria-live="polite">
        <!-- the shape of a page, until the first one draws (docs/dev/ui.md: no "Loading…") -->
        <div class="docs-md docs-skel" aria-busy="true" aria-label="Loading the page">
          <span class="h"></span><span></span><span></span><span class="short"></span><span></span><span class="short"></span>
        </div>
      </div>
      <div class="docs-pager" id="docs-pager"></div>
    </article>
    <aside class="docs-toc" id="docs-toc" aria-label="On this page"></aside>
  </div>

  <script src="/_dd/web/purify.js"></script>
  <script type="module" src="/_dd/static/shell.js"></script>
  <script type="module" src="/_dd/static/docs.js"></script>
</body>
</html>
