[package]
name = "release"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dd-agent"
path = "src/bin/dd-agent.rs"

[[bin]]
name = "dd-attest"
path = "src/bin/dd-attest.rs"

[[bin]]
name = "dd-box-setup"
path = "src/bin/dd-box-setup.rs"

[[bin]]
name = "dd-backup-seal"
path = "src/bin/dd-backup-seal.rs"

[dependencies]
sha2 = "0.10"
identity = { path = "../../../client/identity" }
# a box's backup password, sealed to its owner's keys (dd-backup-seal)
library = { path = "../../../client/library" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
# the agent fetches one small file; nothing async, nothing heavy
ureq = { version = "3", default-features = false, features = ["rustls"] }
clap = { version = "4", features = ["derive", "env"] }
# the box installer reads its join ticket's id (setup.rs), never verifies it
biscuit-auth = "6"
