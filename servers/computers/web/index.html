<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Remote computers</title>
  <link rel="stylesheet" href="/_dd/static/home.css">
  <link rel="stylesheet" href="/static/computers.css">
</head>
<body>
  <header class="dd-bar">
    <div class="bar">
      <a class="brand" href="/_dd/home" aria-label="Commonty">
        <svg viewBox="0 0 22 22" aria-hidden="true">
          <rect class="mark-line" x="1" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="12" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="1" y="12" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-fill" x="12" y="12" width="9" height="9"/>
        </svg>
        <span>Commonty</span>
      </a>
      <div class="me" id="me"></div>
    </div>
  </header>
  <main id="main">
    <!-- the frame: drawn before any answer; vms.js fills the view for the address (#/, #/c/<id>, #/configs, #/configs/<name>, #/new) -->
    <header class="head">
      <div class="head-row">
        <h1><span id="back"></span><span id="title">Remote computers</span></h1>
        <div class="head-acts" id="head-acts"></div>
      </div>
    </header>
    <p class="note" id="note" role="alert" hidden></p>
    <div id="view">
      <section class="usage panel" aria-label="What your remote computers take">
        <div class="meter"><span class="k">Memory</span><span class="bar"><i></i></span><span class="v mono">—</span></div>
        <div class="meter"><span class="k">Threads</span><span class="bar"><i></i></span><span class="v mono">—</span></div>
      </section>
      <div class="cards"><div class="card-c ph" aria-hidden="true"></div><div class="card-c ph" aria-hidden="true"></div></div>
    </div>
  </main>
  <script type="module" src="/static/computers.js"></script>
  <script type="module" src="/_dd/static/shell.js"></script>
</body>
</html>
