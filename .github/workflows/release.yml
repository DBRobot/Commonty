# What a stranger downloads. Nothing here gates a merge: it runs after
# one, on the mirror, because building an apk to hold up a pull request
# spends seven minutes making something nobody fetches until a release
# exists. The fleet's own releases are a different thing entirely and are
# signed on a laptop with a key no runner has (box/release): this builds
# the client, and only the client.
name: release

# What it builds with is pinned, as the fleet's builds are: the same Rust
# the flake compiles with (nix/tests/ci.nix holds the two together), one
# tauri-cli, and every download checked against its hash. A tag rebuilt
# next month makes what it made today.
env:
  TAURI_CLI: "2.12.1"

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "the tag to build and publish"
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # the tag, whether it was pushed or named by hand: a hand run
        # would otherwise build the default branch under the tag's name
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - name: what tauri needs on ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
          # the webview plays video through gstreamer: the AppImage carries
          # these plugins (bundle.linux.appimage.bundleMediaFramework) and
          # the .deb asks the system for them
          sudo apt-get install -y gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: "1.95.0" }
      # the dependencies, built once per Cargo.lock and toolchain, as the
      # fleet's own builds keep them apart from our code: a tag compiles
      # only what changed since the last one
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "${{ github.job }}" }
      # tauri-cli, built once per version rather than on every run
      - id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI }}-${{ runner.os }}-rust-1.95.0
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install tauri-cli --version "=$TAURI_CLI" --locked
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: app/net/go.mod, cache-dependency-path: app/net/go.sum }
      - name: the engine the app links
        run: |
          cd app/net
          go build -buildmode=c-archive -o libcommontynet.a .
          mkdir -p "$RUNNER_TEMP/netlib"
          cp libcommontynet.a libcommontynet.h "$RUNNER_TEMP/netlib/"
      - name: build the bundles
        env:
          COMMONTY_NET_LIB_DIR: ${{ runner.temp }}/netlib
        run: |
          cd app && cargo tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # the tag, whether it was pushed or named by hand: a hand run
        # would otherwise build the default branch under the tag's name
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "17" }
      # the runner image carries the sdk and an ndk; setup-android trips on
      # the image's newer sdkmanager, so the licenses are accepted here
      - name: the android sdk's licenses
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android,x86_64-linux-android
      # the dependencies, built once per Cargo.lock and toolchain, as the
      # fleet's own builds keep them apart from our code: a tag compiles
      # only what changed since the last one
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "${{ github.job }}" }
      # tauri-cli, built once per version rather than on every run
      - id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI }}-${{ runner.os }}-rust-1.95.0
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install tauri-cli --version "=$TAURI_CLI" --locked
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        # the Go the flake builds with: "stable" moved to 1.27, which the
        # json package tailscale pins does not build under
        with: { go-version-file: app/net/go.mod, cache-dependency-path: app/net/go.sum }
      - name: the engine, one shared library per abi
        run: |
          NDK=$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | head -1)
          T=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          cd app/net
          mkdir -p "$RUNNER_TEMP/jni/arm64-v8a" "$RUNNER_TEMP/jni/x86_64"
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC=$T/aarch64-linux-android34-clang \
            go build -buildmode=c-shared -o "$RUNNER_TEMP/jni/arm64-v8a/libcommontynet.so" .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC=$T/x86_64-linux-android34-clang \
            go build -buildmode=c-shared -o "$RUNNER_TEMP/jni/x86_64/libcommontynet.so" .
      - name: build the apk
        env:
          COMMONTY_NET_LIB_DIR: ${{ runner.temp }}/jni
        run: |
          mkdir -p app/gen/android/app/src/main/jniLibs
          cp -r "$RUNNER_TEMP/jni/." app/gen/android/app/src/main/jniLibs/
          # the two abis the engine is built for; tauri would build all four
          cd app && cargo tauri android build --apk --target aarch64 --target x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: app/gen/android/app/build/outputs/apk/**/*.apk


  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # the tag, whether it was pushed or named by hand: a hand run
        # would otherwise build the default branch under the tag's name
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { toolchain: "1.95.0" }
      # the dependencies, built once per Cargo.lock and toolchain, as the
      # fleet's own builds keep them apart from our code: a tag compiles
      # only what changed since the last one
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "${{ github.job }}" }
      # tauri-cli, built once per version rather than on every run
      - id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ env.TAURI_CLI }}-${{ runner.os }}-rust-1.95.0
      - if: steps.tauri-cli.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install tauri-cli --version "=$TAURI_CLI" --locked
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        # the Go the flake builds with: "stable" moved to 1.27, which the
        # json package tailscale pins does not build under
        with: { go-version-file: app/net/go.mod, cache-dependency-path: app/net/go.sum }
      - name: the engine, as a dll
        shell: bash
        run: |
          # cgo on Windows builds with mingw and rust links with msvc, so a
          # static archive from one cannot go into the other. A dll is
          # loaded by name and settles the argument.
          cd app/net
          mkdir -p "$RUNNER_TEMP/netlib"
          # msvc links against an import library beside it, which go does
          # not write unless mingw's linker is asked to
          CGO_ENABLED=1 go build -buildmode=c-shared \
            -ldflags "-extldflags=-Wl,--out-implib,$RUNNER_TEMP/netlib/commontynet.lib" \
            -o "$RUNNER_TEMP/netlib/commontynet.dll" .
          ls -la "$RUNNER_TEMP/netlib"
      - name: rclone, which the drive needs
        shell: bash
        env:
          RCLONE: v1.75.1
          RCLONE_SHA256: 200eb602c126d82aa38b51e0f6b9ae837473ff99b51278d3f6f837574c494d6e
        run: |
          # one version, checked: "current" would be whatever rclone put
          # there that day, and the attestation would vouch for it all the same
          curl -sSLo rclone.zip "https://downloads.rclone.org/$RCLONE/rclone-$RCLONE-windows-amd64.zip"
          echo "$RCLONE_SHA256  rclone.zip" | sha256sum -c -
          7z x rclone.zip -orclone-out >/dev/null
          mkdir -p app/bin
          find rclone-out -name rclone.exe -exec cp {} app/bin/ \;
      - name: winfsp, so nobody has to fetch it themselves
        shell: bash
        run: |
          # bundled unmodified, which WinFsp's FLOSS exception permits for
          # software under an OSI licence; Commonty is AGPL-3.0-or-later.
          # The credit it asks for is on the downloads page and in the
          # README: WinFsp - Windows File System Proxy, (C) Bill Zissimopoulos
          curl -sSLo app/bin/winfsp.msi "$WINFSP_URL"
          echo "$WINFSP_SHA256  app/bin/winfsp.msi" | sha256sum -c -
        env:
          WINFSP_URL: https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi
          WINFSP_SHA256: 6324dc81194a6a08f97b6aeca303cf5c2325c53ede153bae9fc4378f0838c101
      - name: the cli, which needs none of the gui
        shell: bash
        run: cargo build --release -p dd
      - name: build the installer
        shell: bash
        env:
          COMMONTY_NET_LIB_DIR: ${{ runner.temp }}/netlib
        run: |
          cd app && cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/dd.exe

  publish:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # the attestation: a statement, signed by GitHub, that these files came
      # out of this workflow at this commit. `dd release app` checks it
      # before the release key will vouch for them.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: out }
      - name: one name per artifact, as the downloads page asks for them
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p rel
          # tauri names these after the product and the crate's version;
          # the page asks for commonty_<tag>_amd64.*
          v="${TAG#v}"
          find out/linux -name '*.deb' | head -1 | xargs -I{} cp {} "rel/commonty_${v}_amd64.deb"
          find out/linux -name '*.AppImage' | head -1 | xargs -I{} cp {} "rel/commonty_${v}_amd64.AppImage"
          find out/android -name '*.apk' | head -1 | xargs -I{} cp {} rel/commonty.apk
          find out/windows -path '*nsis*' -name '*.exe' | head -1 | xargs -I{} cp {} rel/commonty-setup.exe
          find out/windows -name 'dd.exe' | head -1 | xargs -I{} cp {} rel/dd.exe
          ls -la rel/
          # all five, or no release: one gone missing would ship as a
          # greyed-out download instead of a failed build anyone sees
          for f in "commonty_${v}_amd64.deb" "commonty_${v}_amd64.AppImage" commonty.apk commonty-setup.exe dd.exe; do
            [ -s "rel/$f" ] || { echo "missing: $f"; exit 1; }
          done
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: rel/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: rel/*
          fail_on_unmatched_files: true
