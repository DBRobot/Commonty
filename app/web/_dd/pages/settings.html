<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="/_dd/static/home.css">
  <link rel="stylesheet" href="/_dd/static/settings.css">
  <link rel="stylesheet" href="/_dd/static/backups.css">
</head>
<body>
  <header class="dd-bar">
    <div class="bar">
      <a class="brand" href="/_dd/home" aria-label="Commonty">
        <svg viewBox="0 0 22 22" aria-hidden="true">
          <rect class="mark-line" x="1" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="12" y="1" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-line" x="1" y="12" width="9" height="9" fill="none" stroke-width="1.6"/>
          <rect class="mark-fill" x="12" y="12" width="9" height="9"/>
        </svg>
        <span>Commonty</span>
      </a>
      <div class="me" id="me"></div>
    </div>
  </header>
  <main class="se">
    <h1>Settings</h1>
    <nav class="se-nav" aria-label="Settings">
      <a href="#profile" data-tab="profile" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</a>
      <a href="#backups" data-tab="backups"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15h18"/><circle cx="17" cy="17" r=".9" fill="currentColor"/></svg>Backups</a>
    </nav>

    <div class="se-pane" data-pane="profile">
      <div class="se-banner" id="banner" role="status" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/></svg>
        <span>Your email has been changed.</span>
        <button class="x" id="banner-x" aria-label="Dismiss">×</button>
      </div>
      <section class="se-box" aria-labelledby="acct">
        <header><h2 id="acct">Account</h2></header>
        <dl class="se-rows">
          <div class="se-row"><dt>Username</dt><dd id="name">…</dd></div>
          <div class="se-row"><dt>Commonty address</dt><dd class="mono" id="address">…</dd></div>
          <div class="se-row se-email"><dt>Email</dt><dd><iframe id="email" title="Email" allow="publickey-credentials-get"></iframe></dd></div>
          <div class="se-row"><dt>Membership</dt><dd id="role">…</dd></div>
        </dl>
      </section>
      <section class="se-box" aria-labelledby="signin">
        <header><h2 id="signin">Signing in</h2></header>
        <dl class="se-rows">
          <div class="se-row"><dt>Passkeys</dt><dd id="passkeys">…</dd></div>
          <div class="se-row"><dt>Devices</dt><dd id="devices">…</dd></div>
          <div class="se-row"><dt>Recovery key</dt><dd id="recovery">…</dd></div>
        </dl>
      </section>
    </div>

    <div class="se-pane" data-pane="backups" hidden>
      <section class="bk-box" aria-labelledby="images">
        <header><h2 id="images">Your disk images</h2><span class="bk-spacer"></span><span class="bk-muted" id="total"></span></header>
        <p class="bk-note" id="msg">Looking for your images…</p>
        <ul class="bk-list" id="list" hidden></ul>
      </section>
    </div>
  </main>
  <dialog class="bk-dialog" id="ask" aria-labelledby="ask-h">
    <h3 id="ask-h"></h3>
    <p id="ask-size"></p>
    <p>Confirm with your passkey to delete it.</p>
    <p class="bad" id="ask-msg" hidden></p>
    <div class="row"><button class="quiet" id="ask-no">Cancel</button><button class="danger" id="ask-yes">Delete with passkey</button></div>
  </dialog>
  <script type="module" src="/_dd/static/settings.js"></script>
  <script type="module" src="/_dd/static/shell.js"></script>
</body>
</html>
