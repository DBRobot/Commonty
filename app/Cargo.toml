[package]
name = "commonty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Commonty app: a member's device, their libraries, their boxes"

[lib]
name = "commonty_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "commonty"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# the launch secret the app's own pages carry (site.rs)
getrandom = "0.3"
auth = { path = "../client/auth" }
identity = { path = "../client/identity" }
directory = { path = "../client/directory" }
account = { path = "../client/account" }
media = { path = "../client/media" }
# the calendars and address books for other programs on this computer (dav.rs)
davbridge = { path = "../client/davbridge" }
async-trait = "0.1"
# every original out of Photos, as one zip, on the way to leaving (export.rs)
ente = { path = "../client/ente" }
# the one-time key a photo password comes to the app sealed to
library = { path = "../client/library" }
# the tray icon the app stays in with its window closed (background.rs)
tauri = { version = "2", features = ["tray-icon"] }
# the system browser, for setting up a passkey there
tauri-plugin-opener = "2"
# commonty:// links: Photos' or Passwords' site in a browser hands over to the app (local.rs)
tauri-plugin-deep-link = "2"
# a browser's pairing proof: the hash of what only that tab holds (handoff.rs)
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "net", "fs", "io-util", "process"] }
axum = "0.8"
futures-util = "0.3"
# mail sent from this device: SMTP and TLS through the box's pipe, a
# WebSocket over the app's own way to the box (mail.rs)
mailsend = { path = "../client/mailsend" }
tokio-tungstenite = { version = "0.29", default-features = false }
zeroize = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio-util = { version = "0.7", features = ["io"] }
# the home controller: the signed app.json the card comes in, the pairing's
# mac, the door's certificate held to the key pairing gave (smarthome.rs)
release = { path = "../servers/system/release" }
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }

[dev-dependencies]
# a door with a real certificate, for the pin's test (smarthome.rs)
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

# a box's installer drive (boxsetup.rs): the backup it makes on the way
# in, copied into the member's images
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
archive = { path = "../client/archive" }
rustic_core = "0.13"
url = "2"

# a second launch (a commonty:// link) hands its link to the copy already running
[target.'cfg(any(target_os = "linux", windows, target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# the title bar's buttons on Linux (lib.rs); the version tauri already uses
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
