[package]
name = "commonty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Commonty app: a member's device, their libraries, their boxes"

[lib]
name = "commonty_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "commonty"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# the launch secret the app's own pages carry (site.rs)
getrandom = "0.3"
auth = { path = "../client/auth" }
identity = { path = "../client/identity" }
directory = { path = "../client/directory" }
account = { path = "../client/account" }
media = { path = "../client/media" }
# every original out of Photos, as one zip, on the way to leaving (export.rs)
ente = { path = "../client/ente" }
# the one-time key a photo password comes to the app sealed to
library = { path = "../client/library" }
tauri = { version = "2", features = [] }
# the system browser, for setting up a passkey there
tauri-plugin-opener = "2"
# commonty:// links: Photos' or Passwords' site in a browser hands over to the app (local.rs)
tauri-plugin-deep-link = "2"
# a browser's pairing proof: the hash of what only that tab holds (handoff.rs)
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
ed25519-dalek = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "net", "fs", "io-util"] }
axum = "0.8"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

# a second launch (a commonty:// link) hands its link to the copy already running
[target.'cfg(any(target_os = "linux", windows))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# the title bar's buttons on Linux (lib.rs); the version tauri already uses
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
